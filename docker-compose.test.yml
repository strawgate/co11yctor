services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml
    command: ["--config", "/etc/otelcol/config.yaml"]
    # Expose ports here since co11yctor shares this network namespace
    ports:
      - "8080:8080"
      - "4317:4317"
      - "4318:4318"

  co11yctor:
    build: .
    privileged: true
    # Share the collector's network namespace so eBPF TC hooks
    # capture OTLP traffic on ports 4317/4318
    network_mode: "service:otel-collector"
    depends_on:
      - otel-collector
    volumes:
      - ./data:/data
    environment:
      - DB_PATH=/data/co11yctor.db
    command: ["--db", "/data/co11yctor.db", "--port", "8080", "--interface", "eth0", "--verbose"]

  # Generates traces, metrics, and logs continuously
  telemetrygen-traces:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.119.0
    depends_on:
      - otel-collector
    command:
      - traces
      - --otlp-endpoint=otel-collector:4317
      - --otlp-insecure
      - --rate=5
      - --duration=24h
      - --service=demo-frontend

  telemetrygen-metrics:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.119.0
    depends_on:
      - otel-collector
    command:
      - metrics
      - --otlp-endpoint=otel-collector:4317
      - --otlp-insecure
      - --rate=2
      - --duration=24h
      - --service=demo-backend

  telemetrygen-logs:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.119.0
    depends_on:
      - otel-collector
    command:
      - logs
      - --otlp-endpoint=otel-collector:4317
      - --otlp-insecure
      - --rate=3
      - --duration=24h
      - --service=demo-api
